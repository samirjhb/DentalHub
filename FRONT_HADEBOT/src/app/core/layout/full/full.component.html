
<mat-sidenav-container class="mainWrapper blue_theme" [class.light-theme]="theme() === 'light'" [class.dark-theme]="theme() === 'dark'" autosize autoFocus dir="ltr">
  <!-- ============================================================== -->
  <!-- Vertical Sidebar -->
  <!-- ============================================================== -->
  <mat-sidenav #leftsidenav [mode]="isOver ? 'over' : 'side'" [opened]="!isOver"
    (openedChange)="onSidenavOpenedChange($event)" (closedStart)="onSidenavClosedStart()"
    class="sidebarNav" [class.sidebarNav-mini]="!isOver && options.sidenavCollapsed">
    <div class="flex-layout">
      <app-sidebar (toggleMobileNav)="sidenav.toggle()" [showToggle]="isOver"
        [collapsed]="!isOver && options.sidenavCollapsed"></app-sidebar>
      <ng-scrollbar class="position-relative" style="height: 100%">
        <mat-nav-list class="sidebar-list">
          @for(item of navItems; track item) {
          <app-nav-item [item]="item" (notify)="sidenav.toggle()"
            [isOver]="isOver" [collapsed]="!isOver && options.sidenavCollapsed">
          </app-nav-item>
          }
        </mat-nav-list>
      </ng-scrollbar>
    </div>
  </mat-sidenav>
  
  <!-- ============================================================== -->
  <!-- Main Content -->
  <!-- ============================================================== -->
  <mat-sidenav-content class="contentWrapper" #content>
    <!-- ============================================================== -->
    <!-- VerticalHeader -->
    <!-- ============================================================== -->
    
    <app-header [showToggle]="!isOver" [sidenavCollapsed]="options.sidenavCollapsed"
      (toggleMobileNav)="sidenav.toggle()" (toggleSidenavCollapsed)="toggleCollapsed()"></app-header>
    
    <main class="pageWrapper maxWidth">
      <!-- ============================================================== -->
      <!-- Outlet -->
      <!-- ============================================================== -->
      <router-outlet></router-outlet>
    </main>

  </mat-sidenav-content>

</mat-sidenav-container>
