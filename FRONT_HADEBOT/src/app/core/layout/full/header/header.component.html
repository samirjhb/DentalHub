<mat-toolbar class="topbar gap-10">

  <!-- Mobile Menu -->

  <button mat-icon-button (click)="toggleMobileNav.emit()" class="d-flex d-lg-none justify-content-center">
    <i-tabler name="menu-2" class="icon-20 d-flex"></i-tabler>
  </button>

  <button mat-icon-button (click)="toggleTheme()" aria-label="Cambiar tema">
    <i-tabler class="d-flex" [name]="theme() === 'light' ? 'moon' : 'sun'"></i-tabler>
  </button>

  <span class="flex-1-auto"></span>

  <!-- --------------------------------------------------------------- -->
  <!-- profile Dropdown -->
  <!-- --------------------------------------------------------------- -->
  <button mat-mini-fab [matMenuTriggerFor]="profilemenu" aria-label="Cuenta">
    <span class="avatar-initials">{{ initials }}</span>
  </button>
  <mat-menu #profilemenu="matMenu" class="cardWithShadow topbar-dd">
    <div class="p-x-16 p-y-8">
      <span class="f-s-14 text-muted">Sesión iniciada como</span>
      <div class="f-s-14 f-w-600">{{ userEmail }}</div>
    </div>

    <div class="p-x-12 p-y-8">
      <button (click)="logout()" mat-stroked-button class="w-100">Cerrar Sesión</button>
    </div>
  </mat-menu>
</mat-toolbar>
