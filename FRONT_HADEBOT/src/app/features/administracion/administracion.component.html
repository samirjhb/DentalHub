<mat-card class="administracion-card">
  <div class="header-row">
    <div>
      <h2 class="page-title">Administración</h2>
      <p class="page-subtitle">Personal de la clínica y sus roles</p>
    </div>
    <button mat-flat-button color="primary" (click)="openStaffDialog()">
      <i-tabler name="plus" class="icon-18"></i-tabler>
      Nuevo personal
    </button>
  </div>

  <mat-progress-bar *ngIf="isLoading" mode="indeterminate"></mat-progress-bar>

  <div *ngIf="dataSource.data.length === 0 && !isLoading" class="empty-state">
    No hay personal registrado.
  </div>

  <div class="table-responsive" *ngIf="dataSource.data.length > 0">
    <table mat-table [dataSource]="dataSource" class="w-100 mt-3">
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Nombre</th>
        <td mat-cell *matCellDef="let member">
          {{ member.name }}
          <!-- En mobile se ocultan Email/Rol/Fecha (ver .css) para evitar el
               scroll horizontal — este detalle las reemplaza acá. -->
          <div class="mobile-staff-detail">
            <span class="f-s-12 text-muted d-block">{{ member.email }}</span>
            <span class="f-s-12 text-muted d-block">{{ roleLabel(member.role) }}</span>
          </div>
        </td>
      </ng-container>

      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef>Email</th>
        <td mat-cell *matCellDef="let member">{{ member.email }}</td>
      </ng-container>

      <ng-container matColumnDef="role">
        <th mat-header-cell *matHeaderCellDef>Rol</th>
        <td mat-cell *matCellDef="let member">
          <span class="role-badge">{{ roleLabel(member.role) }}</span>
        </td>
      </ng-container>

      <ng-container matColumnDef="createdAt">
        <th mat-header-cell *matHeaderCellDef>Creado</th>
        <td mat-cell *matCellDef="let member">{{ formatDate(member.createdAt) }}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let member">
          <button mat-icon-button matTooltip="Editar" (click)="openEditDialog(member)">
            <i-tabler name="edit" class="icon-18"></i-tabler>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>

    <mat-paginator
      class="w-100"
      [length]="totalItems"
      [pageIndex]="pageIndex"
      [pageSize]="pageSize"
      [pageSizeOptions]="[5, 10, 20]"
      showFirstLastButtons
      (page)="onPageChange($event)"
      aria-label="Seleccionar página de personal">
    </mat-paginator>
  </div>
</mat-card>
