<div class="stock-movement-dialog-container">
  <h2 mat-dialog-title>Registrar movimiento</h2>

  <mat-dialog-content>
    <p>
      {{ data.itemName }} — stock actual: {{ data.currentStock }} {{ data.unit }}
    </p>

    <mat-form-field appearance="outline" class="w-100 mt-3">
      <mat-label>Tipo de movimiento</mat-label>
      <mat-select [(ngModel)]="data.type">
        <mat-option *ngFor="let option of typeOptions" [value]="option.value">
          {{ option.label }}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" class="w-100 mt-3">
      <mat-label>Cantidad</mat-label>
      <input matInput type="number" [(ngModel)]="data.quantity" min="1" required />
    </mat-form-field>

    <mat-form-field appearance="outline" class="w-100 mt-3">
      <mat-label>Motivo (opcional)</mat-label>
      <input matInput [(ngModel)]="data.reason" />
    </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-stroked-button (click)="onCancel()">Cancelar</button>
    <button
      mat-flat-button
      color="primary"
      (click)="onConfirm()"
      [disabled]="data.quantity <= 0 || !data.type"
    >
      Registrar
    </button>
  </mat-dialog-actions>
</div>
