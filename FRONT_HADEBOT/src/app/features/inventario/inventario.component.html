<mat-card class="inventario-card">
  <div class="header-row">
    <div>
      <h2 class="page-title">Inventario</h2>
      <p class="page-subtitle">Insumos y materiales dentales</p>
    </div>
    <button *ngIf="canWrite" mat-flat-button color="primary" (click)="openItemDialog()">
      <i-tabler name="plus" class="icon-18"></i-tabler>
      Nuevo insumo
    </button>
  </div>

  <mat-progress-bar *ngIf="isLoading" mode="indeterminate"></mat-progress-bar>

  <div *ngIf="items.length === 0 && !isLoading" class="empty-state">
    No hay insumos registrados.
  </div>

  <table mat-table [dataSource]="items" *ngIf="items.length > 0" class="w-100 mt-3">
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Insumo</th>
      <td mat-cell *matCellDef="let item">{{ item.name }}</td>
    </ng-container>

    <ng-container matColumnDef="unit">
      <th mat-header-cell *matHeaderCellDef>Unidad</th>
      <td mat-cell *matCellDef="let item">{{ item.unit }}</td>
    </ng-container>

    <ng-container matColumnDef="currentStock">
      <th mat-header-cell *matHeaderCellDef>Stock actual</th>
      <td mat-cell *matCellDef="let item">{{ item.currentStock }}</td>
    </ng-container>

    <ng-container matColumnDef="minStock">
      <th mat-header-cell *matHeaderCellDef>Umbral mínimo</th>
      <td mat-cell *matCellDef="let item">{{ item.minStock }}</td>
    </ng-container>

    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef>Estado</th>
      <td mat-cell *matCellDef="let item">
        <span
          class="status-badge"
          [class.status-low]="isLowStock(item)"
          [class.status-ok]="!isLowStock(item)"
        >
          {{ isLowStock(item) ? 'Stock bajo' : 'OK' }}
        </span>
      </td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let item">
        <button
          *ngIf="canWrite"
          mat-icon-button
          matTooltip="Registrar movimiento"
          (click)="openMovementDialog(item)"
        >
          <i-tabler name="edit" class="icon-18"></i-tabler>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns" [class.row-low-stock]="isLowStock(row)"></tr>
  </table>
</mat-card>
