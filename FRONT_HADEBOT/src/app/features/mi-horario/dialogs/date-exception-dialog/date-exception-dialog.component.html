<div class="p-24">
  <div class="d-flex align-items-center gap-8 mb-3">
    <i-tabler name="calendar-off" class="icon-32"></i-tabler>
    <h2 mat-dialog-title class="m-0">Bloquear fecha</h2>
  </div>

  <mat-dialog-content>
    <mat-form-field appearance="outline" class="w-100 mt-3">
      <mat-label>Fecha</mat-label>
      <input matInput type="date" [(ngModel)]="data.date" required />
    </mat-form-field>

    <mat-slide-toggle [(ngModel)]="data.allDay" class="mt-3 mb-3">
      Bloquear el día completo
    </mat-slide-toggle>

    <div *ngIf="!data.allDay" class="d-flex gap-16">
      <mat-form-field appearance="outline" class="w-100">
        <mat-label>Desde</mat-label>
        <input matInput type="time" [(ngModel)]="data.startTime" required />
      </mat-form-field>
      <mat-form-field appearance="outline" class="w-100">
        <mat-label>Hasta</mat-label>
        <input matInput type="time" [(ngModel)]="data.endTime" required />
      </mat-form-field>
    </div>

    <mat-form-field appearance="outline" class="w-100 mt-3">
      <mat-label>Motivo (opcional)</mat-label>
      <input matInput [(ngModel)]="data.reason" placeholder="Ej: Vacaciones, feriado" />
    </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-stroked-button (click)="onCancel()">Cancelar</button>
    <button mat-flat-button color="primary" [disabled]="!isValid" (click)="onConfirm()">
      Bloquear
    </button>
  </mat-dialog-actions>
</div>
