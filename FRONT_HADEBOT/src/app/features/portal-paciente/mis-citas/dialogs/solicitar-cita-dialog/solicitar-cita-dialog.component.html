<div class="solicitar-cita-dialog-container">
  <div class="dialog-header">
    <i-tabler name="calendar-plus" class="icon-48 mb-3"></i-tabler>
    <h2 mat-dialog-title>Solicitar cita</h2>
  </div>

  <mat-dialog-content>
    <mat-form-field appearance="outline" class="w-100 mt-3">
      <mat-label>Odontólogo</mat-label>
      <mat-select [(ngModel)]="data.dentist">
        <mat-option *ngFor="let dentista of dentistas" [value]="dentista._id">
          {{ dentista.name }}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" class="w-100 mt-3">
      <mat-label>Fecha y hora</mat-label>
      <input matInput type="datetime-local" [(ngModel)]="data.startAt" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="w-100 mt-3">
      <mat-label>Motivo de consulta</mat-label>
      <textarea matInput [(ngModel)]="data.reason" rows="2"></textarea>
    </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-stroked-button (click)="onCancel()">Cancelar</button>
    <button mat-flat-button color="primary" (click)="onConfirm()" [disabled]="!isValid">
      Solicitar
    </button>
  </mat-dialog-actions>
</div>
