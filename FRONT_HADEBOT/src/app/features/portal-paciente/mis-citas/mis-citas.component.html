<mat-card class="cardWithShadow">
  <mat-card-content>
    <div class="d-flex align-items-center justify-content-between m-b-16">
      <h3 class="m-0">Mis citas</h3>
      <button mat-flat-button color="primary" (click)="openSolicitarCitaDialog()">
        <i-tabler name="calendar-plus" class="icon-18 m-r-4"></i-tabler>
        Solicitar cita
      </button>
    </div>

    <mat-progress-bar *ngIf="isLoading" mode="indeterminate"></mat-progress-bar>

    <table mat-table [dataSource]="dataSource" class="w-100 m-t-16" *ngIf="!isLoading">
      <ng-container matColumnDef="startAt">
        <th mat-header-cell *matHeaderCellDef>Fecha y hora</th>
        <td mat-cell *matCellDef="let element">{{ formatDate(element.startAt) }}</td>
      </ng-container>

      <ng-container matColumnDef="reason">
        <th mat-header-cell *matHeaderCellDef>Motivo</th>
        <td mat-cell *matCellDef="let element">{{ element.reason }}</td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Estado</th>
        <td mat-cell *matCellDef="let element">
          <mat-chip [color]="statusColor(element.status)" selected>{{ element.status }}</mat-chip>
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let element">
          <button
            mat-stroked-button
            color="warn"
            *ngIf="canCancel(element)"
            (click)="cancelarCita(element)"
          >
            Cancelar
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>

    <p *ngIf="!isLoading && dataSource.data.length === 0" class="text-muted m-t-16">
      Aún no tienes citas registradas.
    </p>

    <mat-paginator [pageSizeOptions]="[5, 10, 25]" showFirstLastButtons></mat-paginator>
  </mat-card-content>
</mat-card>
