<mat-card class="reportes-card">
  <h2 class="page-title">Reportes</h2>
  <p class="page-subtitle">Métricas de gestión de la clínica</p>

  <div class="filter-row">
    <mat-form-field appearance="outline">
      <mat-label>Desde</mat-label>
      <input matInput [matDatepicker]="startPicker" [(ngModel)]="startDate" />
      <mat-datepicker-toggle matSuffix [for]="startPicker"></mat-datepicker-toggle>
      <mat-datepicker #startPicker></mat-datepicker>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Hasta</mat-label>
      <input matInput [matDatepicker]="endPicker" [(ngModel)]="endDate" />
      <mat-datepicker-toggle matSuffix [for]="endPicker"></mat-datepicker-toggle>
      <mat-datepicker #endPicker></mat-datepicker>
    </mat-form-field>

    <button mat-flat-button color="primary" (click)="applyFilter()">Filtrar</button>
    <button mat-stroked-button (click)="clearFilter()">Limpiar</button>
  </div>

  <mat-progress-bar *ngIf="isLoading" mode="indeterminate"></mat-progress-bar>

  <div class="kpi-row">
    <app-stat-card
      icon="cash"
      label="Ingresos del período"
      [value]="'$' + (revenue?.totalRevenue ?? 0)"
      accentColor="#13deb9"
    ></app-stat-card>
    <app-stat-card
      icon="dental"
      label="Tratamientos"
      [value]="treatments?.total ?? 0"
      accentColor="#5d87ff"
    ></app-stat-card>
    <app-stat-card
      icon="calendar-event"
      label="Citas"
      [value]="appointments?.total ?? 0"
      accentColor="#fa896b"
    ></app-stat-card>
    <app-stat-card
      icon="users"
      label="Pacientes nuevos"
      [value]="newPatientsCount"
      accentColor="#ffae1f"
    ></app-stat-card>
  </div>

  <div class="charts-row">
    <mat-card class="chart-card">
      <h3>Ingresos por método de pago</h3>
      <apx-chart
        [series]="revenueChart.series"
        [chart]="revenueChart.chart"
        [xaxis]="revenueChart.xaxis"
        [dataLabels]="revenueChart.dataLabels"
        [plotOptions]="revenueChart.plotOptions"
      ></apx-chart>
    </mat-card>

    <mat-card class="chart-card">
      <h3>Tratamientos por estado</h3>
      <apx-chart
        [series]="treatmentsChart.series"
        [chart]="treatmentsChart.chart"
        [labels]="treatmentsChart.labels"
        [responsive]="treatmentsChart.responsive"
        [legend]="treatmentsChart.legend"
      ></apx-chart>
    </mat-card>
  </div>

  <div class="charts-row">
    <mat-card class="chart-card">
      <h3>Citas por estado</h3>
      <apx-chart
        [series]="appointmentsStatusChart.series"
        [chart]="appointmentsStatusChart.chart"
        [labels]="appointmentsStatusChart.labels"
        [responsive]="appointmentsStatusChart.responsive"
        [legend]="appointmentsStatusChart.legend"
      ></apx-chart>
    </mat-card>

    <mat-card class="chart-card">
      <h3>Citas por odontólogo</h3>
      <apx-chart
        [series]="appointmentsByDentistChart.series"
        [chart]="appointmentsByDentistChart.chart"
        [xaxis]="appointmentsByDentistChart.xaxis"
        [dataLabels]="appointmentsByDentistChart.dataLabels"
        [plotOptions]="appointmentsByDentistChart.plotOptions"
      ></apx-chart>
    </mat-card>
  </div>
</mat-card>
